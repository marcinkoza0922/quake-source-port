// qsp_enhanced: the built-in "Enhanced Particles" set (r_enhancedparticles).
// FTE particle script syntax. Loaded after r_particledesc and the map's own
// config, so effects a mod or map defines take precedence over these.
// Textures: names containing "glow" use the soft builtin disc, anything else
// missing (qsp_puff) the fuzzy builtin blob.

///////////////////////////////////////////////////////////////////////////
// Shared pieces

r_part qsp_spark
{
	texture qsp_glow
	type texturedspark
	blend add
	count 1
	scale 1.6
	stretchfactor 0.04
	alpha 1
	alphadelta -1.6
	die 0.6
	diesubrand 0.3
	rgb 255 200 120
	rgbdelta 0 -220 -320
	randomvel 140 140
	veladd 40
	gravity 600
	friction 0.5
	cliptype qsp_spark_bounce
	clipbounce 0.4
}

r_part qsp_spark_bounce
{
	texture qsp_glow
	type texturedspark
	blend add
	count 1
	scale 1.2
	stretchfactor 0.03
	alpha 0.7
	alphadelta -2
	die 0.3
	rgb 255 160 80
	rgbdelta 0 -300 -300
	gravity 600
}

r_part qsp_dust
{
	texture qsp_puff
	blend alpha
	count 3
	scale 7
	scalerand 4
	scaledelta 14
	alpha 0.35
	alphadelta -0.45
	die 0.8
	diesubrand 0.3
	rgb 96 88 80
	rgbrand 16 16 16
	randomvel 18 18
	veladd 20
	gravity -8
	friction 1
	rotationstart 0 360
	rotationspeed -40 40
}


# Release builds. Push a tag like v0.1.0 (or run the workflow by hand) to build every
# target and attach the packages to a GitHub release.
# Only Linux x64 has been tested by hand; the other targets are built but untested.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes may write; the builds run other people's code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # As in ci.yml, so a release is built with what was tested.
  RUST_VERSION: "1.100.0"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Compile shaders to SPIR-V (platform independent)
        run: |
          mkdir spv
          for f in crates/qrender/shaders/*.vert crates/qrender/shaders/*.frag crates/qrender/shaders/*.comp; do
            [ -f "$f" ] && glslc --target-env=vulkan1.3 -O -Werror "$f" -o "spv/$(basename "$f").spv"
          done
          ls spv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: spirv, path: spv }

  build:
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, ext: tar.gz }
          - { name: windows-x64, os: windows-latest, ext: zip }
          - { name: windows-arm64, os: windows-11-arm, ext: zip }
          - { name: macos-arm64, os: macos-latest, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: spirv, path: spv }
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Linux packages
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev libdrm-dev libgbm-dev libgl-dev libegl-dev libibus-1.0-dev libsndio-dev
      - name: macOS packages
        if: startsWith(matrix.name, 'macos')
        run: brew install cmake ninja molten-vk
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: "${{ matrix.name }}" }
      - name: Build
        shell: bash
        run: |
          export QSP_SPIRV_DIR="$GITHUB_WORKSPACE/spv"
          cargo build --release --locked -p quake-source-port --features bundled-sdl
      - name: Package
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"; d="quake-source-port-$ref-${{ matrix.name }}"
          mkdir "$d"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/quake-source-port.exe "$d/"
          else
            cp target/release/quake-source-port "$d/"
          fi
          if [ "${{ runner.os }}" = macOS ]; then
            cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "$d/"
            install_name_tool -add_rpath @executable_path "$d/quake-source-port"
          fi
          cp README.md LICENSE "$d/"
          mkdir "$d/docs" && cp docs/MANUAL.md "$d/docs/"
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$d.zip" "$d" >/dev/null; else tar czf "$d.tar.gz" "$d"; fi
          echo "ASSET=$d.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ matrix.name }}", path: "${{ env.ASSET }}" }

  # musl Linux (Alpine, Void musl, Chimera...). Built in an Alpine container with musl
  # linked dynamically, since a static binary cannot dlopen Vulkan or SDL's backends.
  # Alpine runs through `docker run` because GitHub's JavaScript actions do not work
  # inside Alpine job containers on arm64.
  musl:
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-musl-x64, os: ubuntu-24.04 }
          - { name: linux-musl-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: spirv, path: spv }
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e QSP_SPIRV_DIR=/src/spv \
            -e CARGO_TARGET_DIR=/src/target alpine:3.22 sh tools/release_musl.sh
      - name: Package
        run: |
          sudo chown -R "$(id -u)" target
          echo "ASSET=$(sh tools/release_package.sh ${{ matrix.name }} target/release/quake-source-port)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ matrix.name }}", path: "${{ env.ASSET }}" }

  # The BSDs build natively in a QEMU VM and link the system SDL3 package, which users
  # install anyway alongside the Vulkan loader. FreeBSD and NetBSD get Rust from rustup;
  # OpenBSD has no rustup, so it uses the release's packaged Rust, and its binaries only
  # run on the OpenBSD release they were built for. A release goes out without the BSD
  # packages that failed.
  bsd:
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd-x64
            os: freebsd
            version: "14.3"
            setup: >-
              sudo pkg install -y curl cmake ninja pkgconf sdl3 &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          - name: openbsd-x64
            os: openbsd
            version: "7.9"
            setup: >-
              sudo pkg_add -I rust cmake ninja sdl3
          - name: netbsd-x64
            os: netbsd
            version: "10.1"
            setup: >-
              sudo pkgin -y install curl cmake ninja-build pkgconf SDL3 &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: spirv, path: spv }
      - name: Build in VM
        # 1.4.0 and up hide the runner's AMX from the guest; with it, whether NetBSD 10.1
        # booted depended on which runner the job got.
        uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360 # v1.8.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86-64
          cpu_count: 4
          memory: 12G
          environment_variables: QSP_SPIRV_DIR CARGO_TARGET_DIR
          run: |
            ${{ matrix.setup }}
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo --version
            cargo build --release --locked -p quake-source-port
            mkdir -p out && cp "$CARGO_TARGET_DIR/release/quake-source-port" out/
        env:
          QSP_SPIRV_DIR: ${{ github.workspace }}/spv
          # Outside the synced workspace so the VM does not copy gigabytes back.
          CARGO_TARGET_DIR: /tmp/qsp-target
      - name: Package
        run: echo "ASSET=$(sh tools/release_package.sh ${{ matrix.name }} out/quake-source-port)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ matrix.name }}", path: "${{ env.ASSET }}" }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android && rustup default "$RUST_VERSION"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "8.9" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Build and stage Android native libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          # Without the NDK toolchain file cmake-rs passes CMAKE_SYSTEM_PROCESSOR=arm64,
          # which CMake's Android support rejects.
          export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          cargo ndk -t arm64-v8a --platform 24 rustc --release --locked -p quake-source-port --lib \
            --features bundled-sdl-shared --crate-type cdylib
          libs=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$libs"
          cp target/aarch64-linux-android/release/libquake_source_port.so "$libs/libmain.so"
          cp "$(find target/aarch64-linux-android/release/build -name libSDL3.so | head -1)" "$libs/"
          # libmain.so links the NDK's shared C++ runtime. Gradle only packages staged libraries.
          ndk_sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cp "$ndk_sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$libs/"
          ls -la "$libs"
      - name: SDL Java glue
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL /tmp/SDL
          mkdir -p android/app/src/main/java/org/libsdl
          cp -r /tmp/SDL/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          QSP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QSP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            export QSP_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
            trap 'rm -f "$QSP_ANDROID_KEYSTORE"' EXIT
            printf %s "$KEYSTORE_B64" | base64 -d > "$QSP_ANDROID_KEYSTORE"
            gradle --no-daemon assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK has a throwaway key, so players must uninstall (and lose their saves) to update. See android/README.md."
            gradle --no-daemon assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs "$apk"
          cp "$apk" app.apk
      - name: Package
        run: |
          apk=android/app.apk
          for lib in libmain.so libSDL3.so libc++_shared.so; do
            unzip -tq "$apk" "lib/arm64-v8a/$lib"
          done
          ref="${GITHUB_REF_NAME//\//-}"
          cp "$apk" "quake-source-port-$ref-android-arm64.apk"
          echo "ASSET=quake-source-port-$ref-android-arm64.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android-arm64, path: "${{ env.ASSET }}" }

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: web }
      - name: Build WebGPU package
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --locked --version "$version"
          cargo fetch --locked
          tools/webbuild/build.sh
          ref="${GITHUB_REF_NAME//\//-}"
          d="quake-source-port-$ref-web"
          mv target/web "$d"
          cp README.md LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"
          echo "ASSET=$d.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: web, path: "${{ env.ASSET }}", if-no-files-found: error }

  release:
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.ci.result == 'success' && needs.build.result == 'success' &&
      needs.musl.result == 'success' && needs.android.result == 'success' && needs.web.result == 'success'
    needs: [ci, build, musl, bsd, android, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, pattern: "{linux-*,windows-*,macos-*,android-*,freebsd-*,openbsd-*,netbsd-*,web}", merge-multiple: true }
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}", RELEASE_TAG: "${{ github.ref_name }}" }
        run: |
          assets=()
          for target in linux-{x64,arm64,musl-x64,musl-arm64}.tar.gz windows-{x64,arm64}.zip \
                        macos-arm64.tar.gz android-arm64.apk web.tar.gz; do
            asset="dist/quake-source-port-$RELEASE_TAG-$target"
            test -s "$asset" || { echo "Missing release package: $asset" >&2; exit 1; }
            assets+=("$asset")
          done
          missing=""
          for target in {freebsd,openbsd,netbsd}-x64; do
            asset="dist/quake-source-port-$RELEASE_TAG-$target.tar.gz"
            if [ -s "$asset" ]; then assets+=("$asset"); else missing="$missing $target"; fi
          done
          notes="Release builds. **Only Linux x64 has been tested so far**; every other build is untested. You need your own Quake game data. See the README."
          if [ -n "$missing" ]; then
            echo "::warning::Releasing without:$missing"
            notes="$notes Not built this time:$missing."
          fi
          (cd dist && sha256sum "${assets[@]#dist/}" > SHA256SUMS)
          assets+=(dist/SHA256SUMS)
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" --verify-tag --prerelease \
            --notes "$notes"

plugins { id "com.android.application" }

android {
    namespace "org.quakesourceport.app"
    compileSdk 34
    defaultConfig {
        applicationId "org.quakesourceport.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.2.3"
        ndk { abiFilters "arm64-v8a" }
    }
    sourceSets.main {
        // The release workflow stages libmain.so, libSDL3.so and the NDK's libc++_shared.so here.
        // SDL's Java glue is copied to src/main/java/org/libsdl/app.
        jniLibs.srcDirs = ["src/main/jniLibs"]
    }
    // Updates install only over an APK with the same signature, and uninstalling
    // deletes the player's saves: releases need one lasting key (android/README.md).
    def keystore = System.getenv("QSP_ANDROID_KEYSTORE")
    if (keystore) {
        signingConfigs {
            release {
                storeFile file(keystore)
                storePassword System.getenv("QSP_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("QSP_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("QSP_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    // as for the debug builds so far (most of the Java is SDL's)
    lint { checkReleaseBuilds false }
    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }
}

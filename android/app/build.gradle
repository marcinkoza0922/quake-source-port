plugins { id "com.android.application" }

android {
    namespace "org.quakesourceport.app"
    compileSdk 34
    defaultConfig {
        applicationId "org.quakesourceport.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }
    }
    sourceSets.main {
        // libmain.so (the game) and libSDL3.so are copied here by the release workflow;
        // SDL's Java glue is copied to src/main/java/org/libsdl/app.
        jniLibs.srcDirs = ["src/main/jniLibs"]
    }
    buildTypes { release { minifyEnabled false } }
}

// Built-in gamepad bindings (applied after default.cfg).
bind RTRIGGER +attack
bind LTRIGGER +jump
bind ABUTTON +jump
bind BBUTTON +movedown
bind XBUTTON +weaponwheel
bind YBUTTON +weaponwheel
bind LSHOULDER "impulse 12"
bind RSHOULDER "impulse 10"
bind BACK +showscores
bind LTHUMB +speed
bind RTHUMB centerview

// Extra weapon slots, separate from weapon cycling.
bind 9 "weapon_slot 9"
bind 0 "weapon_slot 0"
